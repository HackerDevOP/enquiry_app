<div
  class="min-h-screen bg-slate-950 text-slate-100 p-4 sm:p-6 lg:p-8 font-sans selection:bg-indigo-500 selection:text-white"
>
  <div class="max-w-7xl mx-auto space-y-8">
    <!-- Top Header & Actions Bar -->
    <div
      class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-800/80"
    >
      <div>
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold tracking-wide uppercase mb-2"
        >
          <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
          Admin Dashboard
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
          Enquiry Management
        </h1>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <input
          type="text"
          [formField]="filterForm.customerName"
          placeholder="search by customer name..."
          class="bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 w-full sm:w-64"
        />
        <button
          type="button"
          (click)="toggleModel()"
          class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/25 transition cursor-pointer whitespace-nowrap"
        >
          + Add Enquiry
        </button>
      </div>
    </div>

    <!-- Main Data Table Container -->
    <div
      class="bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden"
    >
      <app-table-ui
        [columns]="enquiryColumns"
        [rows]="filteredEnquiries()"
        [actions]="enquiryActions"
        (rowAction)="handleTableAction($event)"
        (rowClick)="onEdit($event, $event.enquiryId)"
      />

      <!-- Pagination Footer -->
      <div
        class="p-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400"
      >
        <span>Showing 2 of 24 entries</span>
        <div class="flex items-center gap-2">
          <button
            class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer"
          >
            Previous
          </button>
          <button class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold">1</button>
          <button
            class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer"
          >
            2
          </button>
          <button
            class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer"
          >
            Next
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Create / Edit Modal Backdrop & Dialog (Hidden/Shown state wrapper) -->
  <div
    [style.display]="isModelOpen() ? 'flex' : 'none'"
    class="fixed inset-0 bg-slate-950/80 backdrop-blur-md items-center justify-center p-4 z-50 overflow-y-auto"
  >
    <div
      class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 my-8"
    >
      <!-- Modal Header -->
      <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-800">
        <h2 class="text-xl font-bold text-white">
          {{ enquiryModel().enquiryId ? 'Edit Enquiry' : 'Create Enquiry' }}
        </h2>
        <div class="flex justify-between items-center text-center">
          <span class="text-sm font-mono font-bold text-indigo-400 pe-2"
            >#ENQ-{{ enquiryModel().enquiryId }}</span
          >
          <button
            (click)="toggleModel()"
            class="text-slate-400 size-7 hover:text-white text-lg font-bold cursor-pointer"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Form Grid matching IEnquiry -->
      <form (submit)="onUpsert($event)" novalidate class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
              >Customer Name</label
            >
            <input
              type="text"
              [formField]="enquiryForm.customerName"
              placeholder="John Doe"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
              >Customer Email</label
            >
            <input
              type="email"
              [formField]="enquiryForm.customerEmail"
              placeholder="john@example.com"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
              >Customer Phone</label
            >
            <input
              type="tel"
              [formField]="enquiryForm.customerPhone"
              placeholder="mobile number"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
              >Enquiry Type</label
            >
            <select
              [formField]="enquiryForm.enquiryType"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"
            >
              <option selected disabled value="">---select type---</option>
              <option value="Mobile">Mobile</option>
              <option value="Desktop">Desktop</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
              >Category ID</label
            >
            <select
              [formField]="enquiryForm.categoryId"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"
            >
              <option selected disabled value="">---select category---</option>
              @for (cat of loadCategory(); track cat.categoryId) {
                <option [disabled]="!cat.isActive" [value]="cat.categoryId">
                  {{ cat.categoryName }}
                </option>
              }
            </select>
          </div>
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
              >Status ID</label
            >
            <select
              [formField]="enquiryForm.statusId"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"
            >
              <option selected disabled value="">---select status---</option>
              @for (status of loadStatus(); track status.statusId) {
                <option [disabled]="!status.isActive" [value]="status.statusId">
                  {{ status.statusName }}
                </option>
              }
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
              >Enquiry Date</label
            >
            <input
              [formField]="enquiryForm.enquiryDate"
              type="datetime-local"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label
              class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
              >Follow-up Date</label
            >
            <input
              [formField]="enquiryForm.followUpDate"
              type="datetime-local"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
            >Message</label
          >
          <textarea
            [formField]="enquiryForm.message"
            rows="3"
            placeholder="Enquiry details..."
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 resize-none"
          ></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5"
            >Feedback</label
          >
          <textarea
            rows="2"
            [formField]="enquiryForm.feedback"
            placeholder="Internal notes / feedback..."
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 resize-none"
          ></textarea>
        </div>

        <div class="flex items-center gap-3">
          <input
            [formField]="enquiryForm.isConverted"
            type="checkbox"
            id="convertedCheck"
            class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
          />
          <label for="convertedCheck" class="text-sm font-medium text-slate-300 cursor-pointer"
            >Mark as Converted</label
          >
        </div>

        <!-- Modal Footer Buttons -->
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
          <button
            (click)="toggleModel()"
            type="button"
            (click)="clearModel()"
            class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition cursor-pointer"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/25 transition cursor-pointer"
          >
            {{ enquiryModel().enquiryId > 0 ? 'Update Enquiry' : 'Create Enquiry' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
