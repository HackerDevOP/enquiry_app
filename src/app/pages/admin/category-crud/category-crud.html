<div
  class="min-h-screen bg-slate-950 text-slate-100 p-4 sm:p-6 lg:p-8 font-sans selection:bg-indigo-500 selection:text-white"
>
  <div class="max-w-7xl mx-auto space-y-8">
    <!-- Top Header -->
    <div class="pb-6 border-b border-slate-800/80">
      <div
        class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold tracking-wide uppercase mb-2"
      >
        <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
        Admin Panel
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
        Category Management
      </h1>
    </div>

    <!-- Side-by-Side Layout Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
      <!-- LEFT COLUMN: Form (Create / Edit) -->
      <div
        class="bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-2xl shadow-2xl p-6 lg:p-8 sticky top-6"
      >
        <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-800">
          <h2 class="text-lg font-bold text-white">
            {{ isEditMode() ? 'Edit Category' : 'Create Category' }}
          </h2>
        </div>

        <form (submit)="onUpsert($event)" novalidate class="space-y-5">
          <!-- Category Name -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2"
              >Category Name *</label
            >
            <input
              type="text"
              [formField]="categoryForm.categoryName"
              placeholder="e.g. Technical Support"
              class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-3 text-white placeholder-slate-600 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            />
            <app-field-error [control]="categoryForm.categoryName()" />
          </div>

          <!-- Is Active Checkbox -->
          <div
            class="flex items-center justify-between p-4 rounded-xl bg-slate-950/40 border border-slate-800/60"
          >
            <div>
              <span class="block text-sm font-medium text-white">Active Status</span>
              <span class="block text-xs text-slate-400">Enable category for selection</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input [formField]="categoryForm.isActive" type="checkbox" class="sr-only peer" />
              <div
                class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"
              ></div>
            </label>
          </div>

          <!-- Submit Buttons -->
          <div class="flex items-center gap-3 pt-2">
            <button
              type="submit"
              class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow-lg shadow-indigo-600/25 transition cursor-pointer text-sm"
            >
              {{ isEditMode() ? 'Update Category' : 'Save Category' }}
            </button>
            <button
              type="button"
              (click)="onReset()"
              class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition cursor-pointer"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>

      <!-- RIGHT COLUMN: Data Table List -->
      <div
        class="lg:col-span-2 bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden"
      >
        <!-- Table Header Toolbar -->
        <div
          class="p-6 border-b border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4"
        >
          <h2 class="text-lg font-bold text-white">Existing Categories</h2>
        </div>
        <app-table-ui
          [columns]="categoryColumns"
          [rows]="loadCategory()"
          [actions]="categoryActions"
          (rowAction)="handleTableAction($event)"
          (rowClick)="onEdit($event)"
        />
      </div>
    </div>
  </div>
</div>
